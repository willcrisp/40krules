  - {q: "can models on upper floors be charged", expect: charge-move}
  - {q: "when do units take battle-shock tests", expect: battle-shock-tests}

  # --- adversarial near-misses (§9: embark/disembark must not swap) ---
  - {q: "embark rules", expect: embark}
  - {q: "disembarking from a transport", expect: disembark}
  - {q: "shooting phase", expect: shooting-phase}
  - {q: "movement phase", expect: movement-phase}
