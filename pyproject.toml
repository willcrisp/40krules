[project]
name = "rulehound"
version = "0.1.0"
description = "40k Rules Retrieval Prototype - hybrid BM25 + vector search over rule-block chunks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pymupdf>=1.24",
    "sqlite-vec>=0.1.6",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Real embedding model (BAAI/bge-small-en-v1.5). Heavy (pulls torch); the app
# degrades to keyword-only search (or the "hash" test embedder) without it.
embeddings = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rulehound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
